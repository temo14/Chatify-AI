version: '3.8'

services:
  # SQL Server database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: chatify-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:-YourStrong@Password123}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - chatify-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${SQL_SA_PASSWORD:-YourStrong@Password123} -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Qdrant vector database for RAG
  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatify-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - chatify-network
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Chatify AI API
  chatify-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatify-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ChatifyAI;User Id=sa;Password=${SQL_SA_PASSWORD:-YourStrong@Password123};TrustServerCertificate=True;MultipleActiveResultSets=True;
      - AzureOpenAI__Endpoint=${AZURE_OPENAI_ENDPOINT}
      - AzureOpenAI__ApiKey=${AZURE_OPENAI_API_KEY}
      - AzureOpenAI__ChatDeploymentName=${AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-4o}
      - AzureOpenAI__EmbeddingDeploymentName=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}
      - AzureOpenAI__MaxTokens=${AZURE_OPENAI_MAX_TOKENS:-1000}
      - AzureOpenAI__Temperature=${AZURE_OPENAI_TEMPERATURE:-0.7}
      - Chat__MaxToolCalls=${CHAT_MAX_TOOL_CALLS:-5}
      - Chat__MaxConversationHistory=${CHAT_MAX_HISTORY:-20}
      - Qdrant__Endpoint=http://qdrant:6333
      - Qdrant__CollectionName=${QDRANT_COLLECTION:-knowledge-base}
      - Qdrant__VectorSize=${QDRANT_VECTOR_SIZE:-1536}
      - Cache__Enabled=${CACHE_ENABLED:-true}
      - Cache__ConversationExpirationMinutes=${CACHE_CONVERSATION_MINUTES:-60}
      - Cache__EmbeddingExpirationHours=${CACHE_EMBEDDING_HOURS:-24}
      - Resilience__Enabled=${RESILIENCE_ENABLED:-true}
      - Resilience__RetryCount=${RESILIENCE_RETRY_COUNT:-3}
      - Resilience__TimeoutSeconds=${RESILIENCE_TIMEOUT_SECONDS:-30}
      - ApiKeys__demo-user=${API_KEY_DEMO:-demo-key-12345}
      - ApiKeys__test-user=${API_KEY_TEST:-test-key-67890}
      - ApiKeys__admin-user=${API_KEY_ADMIN:-admin-key-abcdef}
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - chatify-network
    volumes:
      - api-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  sqlserver-data:
    driver: local
  qdrant-data:
    driver: local
  api-logs:
    driver: local

networks:
  chatify-network:
    driver: bridge
