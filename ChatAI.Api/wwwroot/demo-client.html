<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatify AI - Demo Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chat-header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        
        .session-info {
            font-size: 12px;
            opacity: 0.9;
            font-family: 'Courier New', monospace;
        }
        
        .new-chat-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f7f9fc;
        }
        
        .message {
            margin-bottom: 16px;
            display: flex;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .message.assistant .message-content {
            background: white;
            border: 1px solid #e1e8ed;
            color: #333;
        }
        
        .message.system .message-content {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            max-width: 100%;
            font-size: 13px;
        }
        
        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e1e8ed;
        }
        
        .chat-input-form {
            display: flex;
            gap: 12px;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .chat-input:focus {
            border-color: #667eea;
        }
        
        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            max-width: 70px;
        }
        
        .typing-indicator.active {
            display: block;
        }
        
        .typing-indicator span {
            height: 8px;
            width: 8px;
            background: #667eea;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div>
                <h1>💬 Chatify AI</h1>
                <div class="session-info" id="sessionInfo">No active session</div>
            </div>
            <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message system">
                <div class="message-content">
                    👋 Welcome to Chatify AI! Start a conversation or continue where you left off.
                </div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <form class="chat-input-form" onsubmit="sendMessage(event)">
                <input 
                    type="text" 
                    class="chat-input" 
                    id="messageInput" 
                    placeholder="Type your message..."
                    autocomplete="off"
                />
                <button type="submit" class="send-btn" id="sendBtn">Send</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api/chat'; // Update with your API URL
        const SESSION_STORAGE_KEY = 'chatify_session_id';
        
        class ChatifyClient {
            constructor() {
                this.sessionId = this.loadSessionId();
                this.updateSessionInfo();
            }
            
            // Load sessionId from localStorage
            loadSessionId() {
                return localStorage.getItem(SESSION_STORAGE_KEY) || null;
            }
            
            // Save sessionId to localStorage
            saveSessionId(sessionId) {
                this.sessionId = sessionId;
                localStorage.setItem(SESSION_STORAGE_KEY, sessionId);
                this.updateSessionInfo();
            }
            
            // Clear sessionId (start new chat)
            clearSessionId() {
                this.sessionId = null;
                localStorage.removeItem(SESSION_STORAGE_KEY);
                this.updateSessionInfo();
            }
            
            // Update UI with current session info
            updateSessionInfo() {
                const infoElement = document.getElementById('sessionInfo');
                if (this.sessionId) {
                    infoElement.textContent = `Session: ${this.sessionId.substring(0, 8)}...`;
                } else {
                    infoElement.textContent = 'Ready to start new chat';
                }
            }
            
            // Send message to API
            async sendMessage(message) {
                const response = await fetch(`${API_URL}/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        sessionId: this.sessionId, // null for new chat, or existing sessionId
                        useTools: true
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }
                
                const data = await response.json();
                
                // CRITICAL: Save the sessionId from response
                // This is either the NEW sessionId (if we sent null) or the SAME sessionId (if continuing)
                if (data.sessionId) {
                    this.saveSessionId(data.sessionId);
                }
                
                return data;
            }
            
            // Load conversation history
            async loadHistory() {
                if (!this.sessionId) return [];
                
                const response = await fetch(`${API_URL}/sessions/${this.sessionId}/messages`);
                if (!response.ok) return [];
                
                return await response.json();
            }
        }
        
        // Global client instance
        const chatClient = new ChatifyClient();
        
        // Add message to UI
        function addMessage(role, content) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            messageDiv.appendChild(contentDiv);
            messagesDiv.appendChild(messageDiv);
            
            // Scroll to bottom
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        // Show/hide typing indicator
        function setTyping(isTyping) {
            const messagesDiv = document.getElementById('chatMessages');
            let indicator = document.getElementById('typingIndicator');
            
            if (isTyping) {
                if (!indicator) {
                    indicator = document.createElement('div');
                    indicator.id = 'typingIndicator';
                    indicator.className = 'message assistant';
                    indicator.innerHTML = `
                        <div class="typing-indicator active">
                            <span></span><span></span><span></span>
                        </div>
                    `;
                    messagesDiv.appendChild(indicator);
                }
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            } else {
                if (indicator) {
                    indicator.remove();
                }
            }
        }
        
        // Send message
        async function sendMessage(event) {
            event.preventDefault();
            
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Disable input
            input.disabled = true;
            sendBtn.disabled = true;
            
            // Add user message to UI
            addMessage('user', message);
            input.value = '';
            
            // Show typing indicator
            setTyping(true);
            
            try {
                // Send to API
                const response = await chatClient.sendMessage(message);
                
                // Hide typing indicator
                setTyping(false);
                
                // Add AI response to UI
                addMessage('assistant', response.reply);
                
                // Show tool call info if any
                if (response.toolCalled && response.toolCall) {
                    addMessage('system', `🔧 Used tool: ${response.toolCall.toolName}`);
                }
                
            } catch (error) {
                setTyping(false);
                addMessage('system', `❌ Error: ${error.message}`);
            } finally {
                // Re-enable input
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }
        
        // Start new chat
        function startNewChat() {
            if (confirm('Start a new conversation? Current chat will be saved and can be accessed later.')) {
                chatClient.clearSessionId();
                
                // Clear UI
                const messagesDiv = document.getElementById('chatMessages');
                messagesDiv.innerHTML = `
                    <div class="message system">
                        <div class="message-content">
                            🆕 New conversation started. What would you like to chat about?
                        </div>
                    </div>
                `;
            }
        }
        
        // Load previous conversation on startup (if exists)
        window.addEventListener('DOMContentLoaded', async () => {
            if (chatClient.sessionId) {
                try {
                    const history = await chatClient.loadHistory();
                    
                    if (history.length > 0) {
                        // Clear welcome message
                        const messagesDiv = document.getElementById('chatMessages');
                        messagesDiv.innerHTML = '';
                        
                        // Add system message
                        addMessage('system', '📂 Loaded previous conversation');
                        
                        // Add history messages
                        history.forEach(msg => {
                            addMessage(msg.role === 'User' ? 'user' : 'assistant', msg.content);
                        });
                    }
                } catch (error) {
                    console.error('Failed to load history:', error);
                }
            }
            
            // Focus input
            document.getElementById('messageInput').focus();
        });
    </script>
</body>
</html>
