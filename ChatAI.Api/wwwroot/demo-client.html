<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatify AI - Intelligent Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-gradient: linear-gradient(135deg, #000000 0%, #333333 100%);
            --primary-color: #000000;
            --secondary-color: #333333;
            --bg-light: #f7f9fc;
            --border-color: #e1e8ed;
            --text-primary: #333;
            --text-secondary: #666;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --info-color: #3b82f6;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--primary-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            height: 700px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            background: var(--primary-gradient);
            color: white;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .chat-header h1 {
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .session-info {
            font-size: 11px;
            opacity: 0.85;
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
        }
        
        .header-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .header-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: var(--bg-light);
            scroll-behavior: smooth;
        }
        
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 4px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #a0aec0;
        }
        
        .message {
            margin-bottom: 20px;
            display: flex;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-right: 10px;
        }
        
        .message.user .message-avatar {
            background: var(--primary-gradient);
            color: white;
            order: 2;
            margin-right: 0;
            margin-left: 10px;
        }
        
        .message.assistant .message-avatar {
            background: #e0e7ff;
            color: var(--primary-color);
        }
        
        .message-wrapper {
            display: flex;
            align-items: flex-start;
            max-width: 75%;
        }
        
        .message.user .message-wrapper {
            flex-direction: row-reverse;
        }
        
        .message-content {
            padding: 14px 18px;
            border-radius: 14px;
            word-wrap: break-word;
            line-height: 1.6;
            position: relative;
        }
        
        .message.user .message-content {
            background: var(--primary-gradient);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant .message-content {
            background: white;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        
        .message-timestamp {
            font-size: 10px;
            color: var(--text-secondary);
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }
        
        .message.user .message-timestamp {
            color: rgba(255, 255, 255, 0.8);
        }
        
        /* Markdown Styling */
        .message.assistant .message-content h1,
        .message.assistant .message-content h2,
        .message.assistant .message-content h3 {
            margin-top: 16px;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .message.assistant .message-content h2 {
            font-size: 18px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 6px;
        }
        
        .message.assistant .message-content h3 {
            font-size: 16px;
            color: var(--primary-color);
        }
        
        .message.assistant .message-content ul,
        .message.assistant .message-content ol {
            margin: 12px 0 12px 24px;
        }
        
        .message.assistant .message-content li {
            margin-bottom: 6px;
        }
        
        .message.assistant .message-content p {
            margin-bottom: 12px;
        }
        
        .message.assistant .message-content p:last-child {
            margin-bottom: 0;
        }
        
        .message.assistant .message-content code {
            background: #f3f4f6;
            padding: 3px 6px;
            border-radius: 4px;
            font-family: 'Courier New', Monaco, monospace;
            font-size: 13px;
            color: #d63384;
        }
        
        .message.assistant .message-content pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 14px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            border-left: 3px solid var(--primary-color);
        }
        
        .message.assistant .message-content pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }
        
        .message.assistant .message-content strong {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .message.assistant .message-content a {
            color: var(--primary-color);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        
        .message.assistant .message-content a:hover {
            border-bottom-color: var(--primary-color);
        }
        
        .message.assistant .message-content blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 16px;
            margin: 12px 0;
            color: var(--text-secondary);
            font-style: italic;
        }
        
        .message-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            margin-top: 8px;
        }
        
        .badge-tool {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .badge-knowledge {
            background: #dcfce7;
            color: #166534;
        }
        
        .badge-email {
            background: #fef3c7;
            color: #92400e;
        }
        
        .message.system {
            justify-content: center;
        }
        
        .message.system .message-content {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            max-width: 100%;
            font-size: 13px;
            text-align: center;
            border-radius: 8px;
        }
        
        .feedback-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }
        
        .feedback-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            color: var(--text-secondary);
        }
        
        .feedback-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: rgba(102, 126, 234, 0.05);
        }
        
        .feedback-btn.active-positive {
            border-color: var(--success-color);
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
        }
        
        .feedback-btn.active-negative {
            border-color: var(--error-color);
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
        }
        
        .feedback-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .chat-input-container {
            padding: 20px 24px;
            background: white;
            border-top: 1px solid var(--border-color);
        }
        
        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        
        .input-group {
            flex: 1;
            position: relative;
        }
        
        .chat-input {
            width: 100%;
            padding: 14px 16px;
            padding-right: 45px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            resize: none;
            max-height: 120px;
            font-family: inherit;
        }
        
        .chat-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .char-counter {
            position: absolute;
            right: 12px;
            bottom: 12px;
            font-size: 11px;
            color: var(--text-secondary);
            opacity: 0.6;
        }
        
        .send-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        
        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }
        
        .send-btn:active:not(:disabled) {
            transform: translateY(0);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .typing-indicator {
            display: none;
        }
        
        .typing-indicator.active {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        
        .typing-indicator .message-avatar {
            background: #e0e7ff;
            color: var(--primary-color);
        }
        
        .typing-dots {
            padding: 14px 18px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 4px;
        }
        
        .typing-dots span {
            height: 8px;
            width: 8px;
            background: var(--primary-color);
            border-radius: 50%;
            display: inline-block;
            animation: typing 1.4s infinite;
        }
        
        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }
        
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: white;
            padding: 14px 20px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideInUp 0.3s ease-out;
            z-index: 1000;
            max-width: 400px;
        }
        
        @keyframes slideInUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .toast.success {
            border-left: 4px solid var(--success-color);
        }
        
        .toast.error {
            border-left: 4px solid var(--error-color);
        }
        
        .toast.info {
            border-left: 4px solid var(--info-color);
        }
        
        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        
        .welcome-message h2 {
            color: var(--primary-color);
            margin-bottom: 12px;
            font-size: 24px;
        }
        
        .welcome-message p {
            margin-bottom: 24px;
            line-height: 1.6;
        }
        
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .quick-action-btn {
            background: white;
            border: 2px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            color: var(--text-primary);
        }
        
        .quick-action-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .chat-container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }
            
            .message-wrapper {
                max-width: 85%;
            }
            
            .header-actions {
                flex-direction: column;
                gap: 6px;
            }
            
            .header-btn {
                font-size: 11px;
                padding: 6px 10px;
            }
        }
    </style>
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-left">
                <div>
                    <h1><i class="fas fa-comments"></i> Chatify AI</h1>
                    <div class="session-info" id="sessionInfo">
                        <i class="fas fa-circle" style="font-size: 6px;"></i> Ready to start
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button class="header-btn" onclick="clearChat()" title="Clear chat history">
                    <i class="fas fa-trash-alt"></i> Clear
                </button>
                <button class="header-btn" onclick="startNewChat()" title="Start new conversation">
                    <i class="fas fa-plus"></i> New Chat
                </button>
            </div>
        </div>
        
        <div class="api-key-container" id="apiKeyContainer" style="padding: 20px; background: #f7f9fc; border-bottom: 1px solid #e1e8ed;">
            <div style="max-width: 600px; margin: 0 auto;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500; color: #333;">
                    <i class="fas fa-key"></i> API Key (Required)
                </label>
                <div style="display: flex; gap: 10px;">
                    <input 
                        type="password" 
                        id="apiKeyInput" 
                        placeholder="Enter your API key (chatai_...)" 
                        style="flex: 1; padding: 10px 14px; border: 1px solid #e1e8ed; border-radius: 8px; font-size: 14px;"
                    />
                    <button 
                        onclick="saveApiKey()" 
                        style="padding: 10px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500;">
                        <i class="fas fa-check"></i> Save
                    </button>
                </div>
                <small style="display: block; margin-top: 6px; color: #666;">Your API key is stored locally and used for authentication.</small>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <h2>👋 Welcome to Chatify AI!</h2>
                <p>I'm your intelligent assistant with access to knowledge base and support tools.</p>
                <div class="quick-actions">
                    <button class="quick-action-btn" onclick="sendQuickMessage('Tell me about your capabilities')">
                        <i class="fas fa-info-circle"></i> My capabilities
                    </button>
                    <button class="quick-action-btn" onclick="sendQuickMessage('What can you help me with?')">
                        <i class="fas fa-question-circle"></i> How can you help?
                    </button>
                </div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <div class="input-group">
                    <textarea 
                        class="chat-input" 
                        id="messageInput" 
                        placeholder="Type your message... (Shift+Enter for new line)"
                        rows="1"
                        maxlength="10000"
                    ></textarea>
                    <span class="char-counter" id="charCounter">0/10000</span>
                </div>
                <button type="button" class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i> Send
                </button>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_URL = '/api/chat';
        const MAX_MESSAGE_LENGTH = 10000;
        
        // ChatifyClient class - handles all API communication
        class ChatifyClient {
            constructor() {
                this.sessionId = this.loadSessionId();
                this.apiKey = this.loadApiKey();
                this.updateSessionInfo();
                this.updateApiKeyUI();
            }
            
            loadSessionId() {
                return localStorage.getItem('chatify_session_id');
            }
            
            loadApiKey() {
                return localStorage.getItem('chatify_api_key');
            }
            
            saveApiKey(apiKey) {
                this.apiKey = apiKey;
                localStorage.setItem('chatify_api_key', apiKey);
                this.updateApiKeyUI();
            }
            
            updateApiKeyUI() {
                const input = document.getElementById('apiKeyInput');
                if (input) {
                    input.value = this.apiKey || '';
                    if (this.apiKey) {
                        input.type = 'password';
                    }
                }
            }
            
            getHeaders() {
                const headers = { 'Content-Type': 'application/json' };
                if (this.apiKey) {
                    headers['X-API-Key'] = this.apiKey;
                }
                return headers;
            }
            
            saveSessionId(sessionId) {
                this.sessionId = sessionId;
                localStorage.setItem('chatify_session_id', sessionId);
                this.updateSessionInfo();
            }
            
            clearSessionId() {
                this.sessionId = null;
                localStorage.removeItem('chatify_session_id');
                this.updateSessionInfo();
            }
            
            updateSessionInfo() {
                const infoElement = document.getElementById('sessionInfo');
                if (this.sessionId) {
                    infoElement.innerHTML = `<i class="fas fa-circle" style="font-size: 6px; color: #10b981;"></i> Session: ${this.sessionId.substring(0, 8)}...`;
                } else {
                    infoElement.innerHTML = `<i class="fas fa-circle" style="font-size: 6px;"></i> Ready to start`;
                }
            }
            
            async sendMessage(message) {
                if (!this.apiKey) {
                    throw new Error('API key is required. Please enter your API key above.');
                }
                
                const response = await fetch(`${API_URL}/send`, {
                    method: 'POST',
                    headers: this.getHeaders(),
                    body: JSON.stringify({
                        message: message,
                        sessionId: this.sessionId,
                        useTools: true
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json().catch(() => ({ message: 'Unknown error' }));
                    throw new Error(error.message || `API error: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.sessionId) {
                    this.saveSessionId(data.sessionId);
                }
                
                return data;
            }
            
            async loadHistory() {
                if (!this.sessionId || !this.apiKey) return [];
                
                try {
                    const response = await fetch(`${API_URL}/sessions/${this.sessionId}/messages`, {
                        headers: this.getHeaders()
                    });
                    if (!response.ok) return [];
                    return await response.json();
                } catch (error) {
                    console.error('Failed to load history:', error);
                    return [];
                }
            }
        }
        
        // Global client instance
        const chatClient = new ChatifyClient();
        
        // UI Helper Functions
        function formatTimestamp() {
            const now = new Date();
            return now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }
        
        function addMessage(role, content, metadata = {}) {
            const messagesDiv = document.getElementById('chatMessages');
            
            // Remove welcome message if present
            const welcome = messagesDiv.querySelector('.welcome-message');
            if (welcome) {
                welcome.remove();
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = 'message-wrapper';
            
            // Avatar
            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'message-avatar';
            if (role === 'user') {
                avatarDiv.innerHTML = '<i class="fas fa-user"></i>';
            } else if (role === 'assistant') {
                avatarDiv.innerHTML = '<i class="fas fa-robot"></i>';
            }
            
            // Content
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (role === 'assistant' && typeof marked !== 'undefined') {
                // Configure marked for better rendering
                marked.setOptions({
                    breaks: true,
                    gfm: true
                });
                contentDiv.innerHTML = marked.parse(content);
            } else {
                contentDiv.textContent = content;
            }
            
            // Add metadata badges if present
            if (metadata.toolCalled) {
                const badge = document.createElement('div');
                badge.className = `message-badge badge-${metadata.toolName === 'EmailPlugin' ? 'email' : 'knowledge'}`;
                badge.innerHTML = `<i class="fas fa-${metadata.toolName === 'EmailPlugin' ? 'envelope' : 'book'}"></i> ${metadata.toolName}`;
                contentDiv.appendChild(badge);
            }
            
            // Timestamp
            if (role !== 'system') {
                const timestamp = document.createElement('div');
                timestamp.className = 'message-timestamp';
                timestamp.textContent = formatTimestamp();
                contentDiv.appendChild(timestamp);
            }
            
            // Add feedback buttons for assistant messages
            if (role === 'assistant' && metadata.messageId) {
                const feedbackDiv = document.createElement('div');
                feedbackDiv.className = 'feedback-buttons';
                feedbackDiv.innerHTML = `
                    <button class="feedback-btn" onclick="submitFeedback('${metadata.messageId}', true, this)" title="Helpful response">
                        <i class="fas fa-thumbs-up"></i> Helpful
                    </button>
                    <button class="feedback-btn" onclick="submitFeedback('${metadata.messageId}', false, this)" title="Not helpful">
                        <i class="fas fa-thumbs-down"></i> Not Helpful
                    </button>
                `;
                contentDiv.appendChild(feedbackDiv);
            }
            
            if (role !== 'system') {
                wrapperDiv.appendChild(avatarDiv);
            }
            wrapperDiv.appendChild(contentDiv);
            messageDiv.appendChild(wrapperDiv);
            messagesDiv.appendChild(messageDiv);
            
            scrollToBottom();
        }
        
        function setTyping(isTyping) {
            const messagesDiv = document.getElementById('chatMessages');
            let indicator = document.getElementById('typingIndicator');
            
            if (isTyping) {
                if (!indicator) {
                    indicator = document.createElement('div');
                    indicator.id = 'typingIndicator';
                    indicator.className = 'typing-indicator active';
                    indicator.innerHTML = `
                        <div class="message-avatar">
                            <i class="fas fa-robot"></i>
                        </div>
                        <div class="typing-dots">
                            <span></span><span></span><span></span>
                        </div>
                    `;
                    messagesDiv.appendChild(indicator);
                }
                scrollToBottom();
            } else {
                if (indicator) {
                    indicator.remove();
                }
            }
        }
        
        function scrollToBottom() {
            const messagesDiv = document.getElementById('chatMessages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle';
            toast.innerHTML = `
                <i class="fas fa-${icon}" style="font-size: 18px;"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideInUp 0.3s ease-out reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        function updateCharCounter() {
            const input = document.getElementById('messageInput');
            const counter = document.getElementById('charCounter');
            counter.textContent = `${input.value.length}/${MAX_MESSAGE_LENGTH}`;
        }
        
        function setInputState(disabled) {
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            input.disabled = disabled;
            sendBtn.disabled = disabled;
            
            if (!disabled) {
                input.focus();
            }
        }
        
        // Message sending
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || message.length > MAX_MESSAGE_LENGTH) {
                return;
            }
            
            setInputState(true);
            addMessage('user', message);
            input.value = '';
            updateCharCounter();
            
            setTyping(true);
            
            try {
                const response = await chatClient.sendMessage(message);
                setTyping(false);
                
                const metadata = {
                    messageId: response.messageId,
                    toolCalled: response.toolCalled,
                    toolName: response.toolCall?.toolName
                };
                
                addMessage('assistant', response.reply, metadata);
                
                if (response.toolCalled) {
                    console.log('Tool used:', response.toolCall);
                }
                
            } catch (error) {
                setTyping(false);
                addMessage('system', `❌ Error: ${error.message}`);
                showToast(`Failed to send message: ${error.message}`, 'error');
            } finally {
                setInputState(false);
            }
        }
        
        function sendQuickMessage(message) {
            const input = document.getElementById('messageInput');
            input.value = message;
            updateCharCounter();
            autoResizeTextarea();
            // Send immediately
            setTimeout(() => sendMessage(), 100);
        }
        
        function clearChat() {
            if (confirm('Clear all messages from this chat?')) {
                const messagesDiv = document.getElementById('chatMessages');
                messagesDiv.innerHTML = `
                    <div class="welcome-message">
                        <h2>Chat cleared!</h2>
                        <p>Start a new conversation below.</p>
                    </div>
                `;
                showToast('Chat cleared', 'success');
            }
        }
        
        function startNewChat() {
            if (chatClient.sessionId && !confirm('Start a new conversation? Current chat will be saved.')) {
                return;
            }
            
            chatClient.clearSessionId();
            
            const messagesDiv = document.getElementById('chatMessages');
            messagesDiv.innerHTML = `
                <div class="welcome-message">
                    <h2>🆕 New conversation started</h2>
                    <p>What would you like to chat about?</p>
                </div>
            `;
            
            showToast('New conversation started', 'success');
            document.getElementById('messageInput').focus();
        }
        
        // Auto-resize textarea
        function autoResizeTextarea() {
            const textarea = document.getElementById('messageInput');
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }
        
        // Feedback submission
        async function submitFeedback(messageId, isPositive, buttonElement) {
            try {
                const feedbackButtons = buttonElement.parentElement;
                const allButtons = feedbackButtons.querySelectorAll('.feedback-btn');
                
                // Disable all buttons during submission
                allButtons.forEach(btn => btn.disabled = true);
                
                const response = await fetch('/api/feedback', {
                    method: 'POST',
                    headers: chatClient.getHeaders(),
                    body: JSON.stringify({
                        conversationMessageId: messageId,
                        isPositive: isPositive,
                        comment: null
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to submit feedback');
                }
                
                // Update button states
                allButtons.forEach(btn => {
                    btn.classList.remove('active-positive', 'active-negative');
                });
                buttonElement.classList.add(isPositive ? 'active-positive' : 'active-negative');
                
                showToast(isPositive ? 'Thank you for your feedback!' : 'Feedback received, we\'ll improve!', 'success');
                
            } catch (error) {
                console.error('Feedback error:', error);
                showToast('Failed to submit feedback', 'error');
                
                // Re-enable buttons on error
                const allButtons = buttonElement.parentElement.querySelectorAll('.feedback-btn');
                allButtons.forEach(btn => btn.disabled = false);
            }
        }
        
        // Keyboard shortcuts
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
        
        // Save API key function
        function saveApiKey() {
            const apiKeyInput = document.getElementById('apiKeyInput');
            const apiKey = apiKeyInput.value.trim();
            
            if (!apiKey) {
                showToast('Please enter an API key', 'error');
                return;
            }
            
            if (!apiKey.startsWith('chatai_')) {
                showToast('Invalid API key format. Should start with "chatai_"', 'error');
                return;
            }
            
            chatClient.saveApiKey(apiKey);
            showToast('API key saved successfully', 'success');
            apiKeyInput.type = 'password';
        }
        
        // Load previous conversation on startup
        window.addEventListener('DOMContentLoaded', async () => {
            const input = document.getElementById('messageInput');
            input.addEventListener('input', () => {
                updateCharCounter();
                autoResizeTextarea();
            });
            input.addEventListener('keydown', handleKeyDown);
            
            // Load history if session exists
            if (chatClient.sessionId) {
                try {
                    const history = await chatClient.loadHistory();
                    
                    if (history.length > 0) {
                        const messagesDiv = document.getElementById('chatMessages');
                        messagesDiv.innerHTML = '';
                        
                        addMessage('system', '📂 Previous conversation loaded');
                        
                        history.forEach(msg => {
                            addMessage(msg.role === 'User' ? 'user' : 'assistant', msg.content);
                        });
                        
                        showToast('Conversation loaded', 'success');
                    }
                } catch (error) {
                    console.error('Failed to load history:', error);
                    showToast('Could not load previous conversation', 'error');
                }
            }
            
            input.focus();
        });
    </script>
</body>
</html>
