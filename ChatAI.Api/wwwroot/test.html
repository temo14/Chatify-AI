<!DOCTYPE html>
<html>
<head>
    <title>Test Chat API</title>
</head>
<body>
    <h1>Test Chat Endpoint</h1>
    <button onclick="testChat()">Send Test Message</button>
    <pre id="result"></pre>

    <script>
        async function testChat() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Sending request...';
            
            try {
                const response = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Hello, what is 5 + 3?',
                        useTools: true
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    resultEl.textContent = `Error ${response.status}: ${errorText}`;
                    return;
                }

                const data = await response.json();
                resultEl.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                resultEl.textContent = `Exception: ${error.message}\n${error.stack}`;
            }
        }
    </script>
</body>
</html>
