<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Callback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .success {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .error {
            background: #dc2626;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2 id="status">Processing authentication...</h2>
        <p id="message">Please wait while we complete your connection.</p>
        <div id="error" class="error" style="display: none;"></div>
    </div>
    
    <script>
        (function() {
            const params = new URLSearchParams(window.location.hash.substring(1));
            const success = params.get('oauth-success');
            const error = params.get('oauth-error');
            const webhookUrl = params.get('webhook-url');
            const verifyToken = params.get('verify-token');
            
            if (error) {
                document.getElementById('status').textContent = 'Authentication Failed';
                document.getElementById('message').style.display = 'none';
                document.getElementById('error').textContent = decodeURIComponent(error);
                document.getElementById('error').style.display = 'block';
                document.querySelector('.spinner').style.display = 'none';
                
                // Notify parent window
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'oauth-complete',
                        success: false,
                        error: decodeURIComponent(error)
                    }, window.location.origin);
                }
                
                setTimeout(() => {
                    window.close();
                }, 5000);
                
            } else if (success === 'true') {
                document.getElementById('status').innerHTML = '<div class="success">✓</div>Connected Successfully!';
                document.getElementById('message').textContent = 'You can close this window now.';
                document.querySelector('.spinner').style.display = 'none';
                
                // Notify parent window
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'oauth-complete',
                        success: true,
                        webhookUrl: decodeURIComponent(webhookUrl || ''),
                        verifyToken: decodeURIComponent(verifyToken || '')
                    }, window.location.origin);
                }
                
                setTimeout(() => {
                    window.close();
                }, 2000);
            } else {
                document.getElementById('status').textContent = 'Invalid Response';
                document.getElementById('message').textContent = 'No valid parameters received.';
            }
        })();
    </script>
</body>
</html>
